[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pyferro"
# Single source of truth: __version__ in ferro/__init__.py
dynamic = ["version"]
description = "Temperature-dependent lock-in data acquisition for the PHY445 phase-transition lab (EG&G 5302 + Omega CND3)"
requires-python = ">=3.10"
dependencies = [
    "PySide6>=6.5",
    "pyqtgraph>=0.13",
    "numpy",
    "pyserial>=3.5",
    "pyvisa>=1.12",
    "pyvisa-py",
    "minimalmodbus>=2.0",
]

[project.optional-dependencies]
test = ["pytest", "pytest-qt"]

[project.gui-scripts]
pyferro = "ferro.__main__:main"

[tool.setuptools.dynamic]
version = { attr = "ferro.__version__" }

[tool.setuptools.packages.find]
include = ["ferro*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
